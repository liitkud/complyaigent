[project]
name = "ferretops-backend"
version = "0.1.0"
description = "FerretOPS Continuous Compliance Engine & Rule Compiler"
dependencies = [
    "datasketch>=1.10.0",
    "fastapi[standard]>=0.136.1",
    "langchain-google-genai>=4.2.2",
    "pymupdf>=1.27.2.3",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.49",
    "sqlmodel>=0.0.38",
    "llama-index>=0.14.20",
    "llama-index-embeddings-cohere>=0.8.0",
    "llama-index-vector-stores-milvus>=1.1.0",
    "llama-index-vector-stores-postgres>=0.8.1",
    "langchain-openai>=0.3.0",
]
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[tool.ty.rules]
unknown-argument = "ignore"
no-matching-overload = "ignore"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "EXE",    # flake8-executable
    "RUF",    # Ruff-specific rules
]
ignore = [
    "B008",   # Do not perform function call `Depends` in parameter defaults
    # The file is executable but no shebang is present
    "E501",   # Line too long
    "BLE001", # Do not catch blind exception: Exception
]
