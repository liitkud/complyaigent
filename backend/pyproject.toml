[project]
name = "complyaigent-backend"
version = "0.1.0"
description = "..."
dependencies = [
    "datasketch>=1.10.0",
    "fastapi[standard]>=0.136.1",
    "langchain-google-genai>=4.2.2",
    "pymupdf>=1.27.2.3",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.49",
    "sqlmodel>=0.0.38",
]
requires-python = ">=3.14"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
