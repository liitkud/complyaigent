version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: comply
      POSTGRES_PASSWORD: complyaigent2026 # pragma: allowlist secret
      POSTGRES_DB: complyaigent
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comply -d complyaigent"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    user: root
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:sqlite:///./test.db}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      COHERE_API_KEY: ${COHERE_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      PROJECT_NAME: ComplyAIgent
      LOG_LEVEL: INFO
      ENVIRONMENT: production
    volumes:
      - ../backend:/app:z
      - /app/.venv
      - /app/__pycache__
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dependencies
    ports:
      - "3001:3000"
    user: root
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: development
    volumes:
      - ../frontend:/app:z
      - /app/node_modules
      - /app/.next
    command: pnpm dev
    depends_on:
      - backend

volumes:
  pgdata_dev:
