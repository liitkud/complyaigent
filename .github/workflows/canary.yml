name: Canary CI (Push & PR)

permissions:
  contents: read
  packages: write
  pull-requests: read

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Detect Changed Subsystems
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker/**'
              - '.github/workflows/canary.yml'
            frontend:
              - 'frontend/**'
              - 'docker/**'
              - '.github/workflows/canary.yml'
            cli:
              - 'cli/**'
              - '.github/workflows/canary.yml'

  backend-canary:
    name: Backend Canary Build
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Canary
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ github.event_name != 'pull_request' && format('{0}/liitkud/ferretops-backend:canary', env.REGISTRY) || 'ferretops-backend:test' }}
            ${{ github.event_name != 'pull_request' && format('{0}/liitkud/ferretops-backend:{1}', env.REGISTRY, steps.vars.outputs.sha_short) || '' }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          platforms: linux/amd64

      - name: Test backend container
        if: github.event_name == 'pull_request'
        run: docker run --rm ferretops-backend:test uv --version

  frontend-canary:
    name: Frontend Canary Build
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend Canary
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ github.event_name != 'pull_request' && format('{0}/liitkud/ferretops-frontend:canary', env.REGISTRY) || 'ferretops-frontend:test' }}
            ${{ github.event_name != 'pull_request' && format('{0}/liitkud/ferretops-frontend:{1}', env.REGISTRY, steps.vars.outputs.sha_short) || '' }}
          build-args: "NEXT_PUBLIC_API_URL=http://backend:8000"
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          platforms: linux/amd64

      - name: Test frontend container
        if: github.event_name == 'pull_request'
        run: docker run --rm ferretops-frontend:test node -v

  cli-canary:
    name: CLI Check & Build
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run Go tests
        run: go test -v ./...

      - name: Build Go CLI
        run: go build -v ./main.go
