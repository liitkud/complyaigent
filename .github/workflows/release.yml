name: Release Pipeline

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - "v*"
    branches: [dev, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  TAG_NAME: ${{ github.ref_name }}

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
        include:
          - service: backend
            dockerfile: ./backend/Dockerfile
            image_name: liitkud/complyaigent-backend
          - service: frontend
            dockerfile: ./frontend/Dockerfile
            image_name: liitkud/complyaigent-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      # https://stackoverflow.com/questions/59810838/how-to-get-the-short-sha-for-the-github-workflow

      - name: Determine tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${{ github.ref_name }}
          else
            VERSION=${{ steps.vars.outputs.sha_short }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image_name }}:${{ steps.tags.outputs.version }}
            ${{ env.REGISTRY }}/${{ matrix.image_name }}:${{ github.ref_type == 'tag' && 'latest' || 'canary' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: linux/amd64, linux/arm64

      - name: Test built containers
        run: |
          docker run --rm \
          ${{ env.REGISTRY }}/${{ matrix.image_name }}:${{ steps.tags.outputs.version }}

  cli:
    name: Build CLI (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            goos: linux
            goarch: amd64
            binary: pg-linux
          - os: macos
            goos: darwin
            goarch: arm64
            binary: pg-macos
          - os: windows
            goos: windows
            goarch: amd64
            binary: pg-windows.exe
    defaults:
      run:
        working-directory: ./cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Build Binary
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -o ${{ matrix.binary }} ./main.go

      - name: Test Binary
        run: |
          ./${{ matrix.binary }} --version

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: cli/${{ matrix.binary }}

      - name: Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cli/${{ matrix.binary }}
          generate_release_notes: true
