name: Release Pipeline

permissions:
  contents: write
  packages: write

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag version (e.g. v0.1.0-mvp)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: Build & Publish Release Containers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
        include:
          - service: backend
            dockerfile: ./backend/Dockerfile
            image_name: liitkud/ferretops-backend
            build_args: ""
          - service: frontend
            dockerfile: ./frontend/Dockerfile
            image_name: liitkud/ferretops-frontend
            build_args: "NEXT_PUBLIC_API_URL=http://backend:8000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(git describe --tags --always)
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image_name }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ matrix.image_name }}:latest
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}-release
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-release
          platforms: linux/amd64,linux/arm64

  cli:
    name: Build & Publish CLI (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            goos: linux
            goarch: amd64
            binary: pg-linux
          - os: macos
            goos: darwin
            goarch: arm64
            binary: pg-macos
          - os: windows
            goos: windows
            goarch: amd64
            binary: pg-windows.exe
    defaults:
      run:
        working-directory: ./cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Build Binary
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -ldflags "-s -w" -o ${{ matrix.binary }} ./main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: cli/${{ matrix.binary }}

      - name: Release Asset
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: cli/${{ matrix.binary }}
          generate_release_notes: true

  copr:
    name: Trigger Fedora COPR Package Build
    runs-on: ubuntu-latest
    needs: [cli]
    if: env.COPR_TOKEN != '' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release')
    env:
      COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
      COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
      COPR_PROJECT: ${{ secrets.COPR_PROJECT || 'ferretops-cli' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install COPR CLI
        run: |
          sudo dnf install -y copr-cli || pip install copr-cli

      - name: Configure COPR Credentials
        run: |
          mkdir -p ~/.config
          cat <<EOF > ~/.config/copr
          [copr-cli]
          login = ${{ secrets.COPR_LOGIN }}
          token = ${{ secrets.COPR_TOKEN }}
          username = ${{ secrets.COPR_USERNAME || secrets.COPR_LOGIN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Trigger Build in COPR
        run: |
          copr-cli build-package ${{ env.COPR_PROJECT }} --name ferretops-cli || echo "COPR build queued"
