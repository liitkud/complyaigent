name: Code Check

# run only on python edits

on:
  push:
    paths: backend/**
  pull_request:
    paths: backend/**
  workflow_dispatch:

jobs:
  py_check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.8"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install checkers
        run: |
          tool_bin="$(uv tool dir --bin)"
          echo "$tool_bin" >> "$GITHUB_PATH"
          uv tool install "semgrep==1.173.0"
          uv tool install "detect-secrets==1.5.0"
          uv tool install "pip-audit==2.10.1"

      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run Ruff check
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format . --check

      - name: Type Checking (ty)
        run: uv run ty check

      - name: Run pytest
        run: uv run python -m pytest -q

      - name: Security Scan (Semgrep)
        run: |
          semgrep --config p/python --error --skip-unknown-extensions .

      - name: Secret Detection
        run: |
          detect-secrets scan --baseline .secrets.baseline

      - name: Security Audit (pip-audit)
        continue-on-error: true
        run: pip-audit --local
