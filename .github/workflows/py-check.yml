name: Code Check

# run only on python edits

on:
  push:
    paths: backend/**
  pull_request:
    paths: backend/**
  workflow_dispatch:

jobs:
  py_check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install checkers
        run: |
          for tool in ty ruff semgrep detect-secrets pip-audit; do uv tool install $tool; done

      - name: Install dependencies
        run: uv sync --python 3.13 --all-extras --dev --frozen

      - name: Run Ruff check
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format . --check

      - name: Type Checking (ty)
        run: uv run ty check

      - name: Security Scan (Semgrep)
        run: |
          uv run semgrep --config p/python --error --skip-unknown-extensions .

      - name: Secret Detection
        run: |
          uv run detect-secrets scan --baseline .secrets.baseline

      - name: Security Audit (pip-audit)
        continue-on-error: true
        run: uv run pip-audit --local
