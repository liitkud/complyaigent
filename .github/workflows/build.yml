name: CI Build & Publish Packages

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: Build & Publish Containers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
        include:
          - service: backend
            dockerfile: ./backend/Dockerfile
            image_name: liitkud/ferretops-backend
            test_cmd: uv --version
            build_args: ""
          - service: frontend
            dockerfile: ./frontend/Dockerfile
            image_name: liitkud/ferretops-frontend
            test_cmd: node -v
            build_args: "NEXT_PUBLIC_API_URL=http://backend:8000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image_name }}:canary
            ${{ env.REGISTRY }}/${{ matrix.image_name }}:${{ steps.vars.outputs.sha_short }}
            ${{ matrix.image_name }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          build-args: ${{ matrix.build_args }}

      - name: Test built containers
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm \
          ${{ matrix.image_name }}:latest \
          ${{ matrix.test_cmd }}

  golang:
    name: Golang Check & Build CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Build CLI
        run: go build -v ./main.go
